name: Build and Release Docent

# This pipeline only triggers when you push a version tag (e.g., v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # 1. BUILD THE ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docent-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # 2. BUILD THE WINDOWS EXECUTABLE
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Windows App
        run: flutter build windows --release
        
      - name: Compress Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Docent-Windows.zip
        
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docent-Windows
          path: Docent-Windows.zip

  # ==========================================
  # 3. PUBLISH THE GITHUB RELEASE
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows] # Waits for both builds to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release page
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Docent-Android
          
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Docent-Windows
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app-release.apk
            Docent-Windows.zip